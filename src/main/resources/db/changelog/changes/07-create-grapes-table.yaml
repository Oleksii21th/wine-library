databaseChangeLog:
  - changeSet:
      id: create-grapes-table
      author: Oleksii Babych
      changes:
        - createTable:
            tableName: grapes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true