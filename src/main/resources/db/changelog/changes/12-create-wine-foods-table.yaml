databaseChangeLog:
  - changeSet:
      id: create-wine-foods-table
      author: Oleksii Babych
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: wine_foods
      changes:
        - createTable:
            tableName: wine_foods
            columns:
              - column:
                  name: wine_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: food_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: wine_foods
            columnNames: wine_id, food_id
            constraintName: pk_wine_foods
        - addForeignKeyConstraint:
            baseTableName: wine_foods
            baseColumnNames: wine_id
            referencedTableName: wines
            referencedColumnNames: id
            constraintName: fk_wine_foods_wine
        - addForeignKeyConstraint:
            baseTableName: wine_foods
            baseColumnNames: food_id
            referencedTableName: foods
            referencedColumnNames: id
            constraintName: fk_wine_foods_food