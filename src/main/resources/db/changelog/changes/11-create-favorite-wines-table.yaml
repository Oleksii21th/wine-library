databaseChangeLog:
  - changeSet:
      id: create-favorite_wines
      author: Oleksii Babych
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: favorite_wines
      changes:
        - createTable:
            tableName: favorite_wines
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_wine_user
                    references: users(id)
              - column:
                  name: wine_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_favorite_wine_wine
                    references: wines(id)
              - column:
                  name: added_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false